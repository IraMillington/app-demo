# Rebuilds this site from the current Health, Recipes and Claro sources. Every
# three hours it checks whether an app's default branch moved (against
# build.json) and builds only then; a change to tools/ or a manual run always
# builds. The built site is committed to the top of main, which Pages serves.
# See tools/README.md.
#
# Secret: DEMO_TOKEN, a fine-grained token with Contents read on health-app,
# claro-spanish and recipes-app. Pushing here uses the workflow's own token.
name: Rebuild the demo

# This repo is public, so its Actions runs do not use the account's minutes.
on:
  schedule: [{cron: "23 */3 * * *"}]
  push: {branches: [main], paths: ["tools/**", ".github/workflows/rebuild.yml"]}
  workflow_dispatch:

concurrency:
  group: rebuild
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      health: ${{ steps.check.outputs.health }}
      claro: ${{ steps.check.outputs.claro }}
      recipes: ${{ steps.check.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: build.json
          # Otherwise checkout leaves this repo's own token in git's config as an
          # Authorization header, which git sends instead of DEMO_TOKEN below.
          persist-credentials: false
      - id: check
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          head() { git ls-remote "https://x-access-token:${TOKEN}@github.com/IraMillington/$1.git" "refs/heads/$2" | cut -f1; }
          health=$(head health-app master)
          claro=$(head claro-spanish main)
          recipes=$(head recipes-app main)
          [ -n "$health" ] && [ -n "$claro" ] && [ -n "$recipes" ] || { echo "cannot read the app repos; check DEMO_TOKEN" >&2; exit 1; }
          deployed=$(cat build.json 2>/dev/null || echo '{}')
          if [ "$EVENT" != schedule ] || [ "$(echo "$deployed" | jq -r .health)" != "$health" ] || [ "$(echo "$deployed" | jq -r .claro)" != "$claro" ] || [ "$(echo "$deployed" | jq -r .recipes)" != "$recipes" ]; then
            build=true
          else
            build=false
          fi
          echo "health=$health claro=$claro recipes=$recipes build=$build"
          { echo "health=$health"; echo "claro=$claro"; echo "recipes=$recipes"; echo "build=$build"; } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: demo-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IraMillington/health-app
          ref: ${{ needs.check.outputs.health }}
          token: ${{ secrets.DEMO_TOKEN }}
          path: tools/health
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IraMillington/claro-spanish
          ref: ${{ needs.check.outputs.claro }}
          token: ${{ secrets.DEMO_TOKEN }}
          path: tools/claro
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IraMillington/recipes-app
          ref: ${{ needs.check.outputs.recipes }}
          token: ${{ secrets.DEMO_TOKEN }}
          path: tools/recipes
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the browser
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build
        env:
          PGPASSWORD: demo-local-only
        run: tools/ci/build.sh
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-logs
          path: |
            tools/tour.log
            tools/site-test.log
            tools/stack/*.log
            tools/*.png
          if-no-files-found: ignore
      - name: Publish
        env:
          HEALTH: ${{ needs.check.outputs.health }}
          CLARO: ${{ needs.check.outputs.claro }}
          RECIPES: ${{ needs.check.outputs.recipes }}
        run: tools/ci/publish.sh tools/site . "$HEALTH" "$CLARO" "$RECIPES" && git push -q origin HEAD:main
